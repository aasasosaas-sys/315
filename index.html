<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="古文315">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#25396d">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>古文単語315 暗記帳</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width app column; indigo "night ink" brand, gold for progress, vertical mincho for headwords. Bottom tab bar, focus screens for study. */
:root{
  --paper:#f3f4ef; --card:#ffffff; --ink:#1d2333; --sub:#687086; --line:#e0e2da; --line2:#eceee8;
  --ai:#25396d; --ai-2:#3b5394; --ai-soft:#e5e9f3; --on-ai:#ffffff; --hero:#25396d; --on-hero:#ffffff;
  --gold:#d79a1c; --gold-soft:#f8ecd2;
  --ok:#2f8653; --ok-soft:#e1f1e7; --ng:#c43d36; --ng-soft:#f8e3e1;
  --shadow:0 1px 2px rgba(29,35,51,.06),0 6px 20px rgba(29,35,51,.06);
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11141d; --card:#1a1f2d; --ink:#e9ebf1; --sub:#959cb0; --line:#2a3043; --line2:#222838;
  --ai:#93a9ec; --ai-2:#b4c4f3; --ai-soft:#222b46; --on-ai:#11141d; --hero:#27386a; --on-hero:#f2f4fa;
  --gold:#f0bd4c; --gold-soft:#3a3020;
  --ok:#6cc48c; --ok-soft:#1c3527; --ng:#ef7c73; --ng-soft:#3e2221;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#11141d; --card:#1a1f2d; --ink:#e9ebf1; --sub:#959cb0; --line:#2a3043; --line2:#222838;
  --ai:#93a9ec; --ai-2:#b4c4f3; --ai-soft:#222b46; --on-ai:#11141d; --hero:#27386a; --on-hero:#f2f4fa;
  --gold:#f0bd4c; --gold-soft:#3a3020;
  --ok:#6cc48c; --ok-soft:#1c3527; --ng:#ef7c73; --ng-soft:#3e2221;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.app.focus{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.disp{font-family:var(--f-disp)}
.num{font-variant-numeric:tabular-nums}

/* ---------- headers ---------- */
.lh{padding:22px 2px 8px;display:flex;align-items:flex-end;gap:12px}
.lh h1{font-family:var(--f-disp);font-weight:800;font-size:28px;line-height:1.2;margin:0;letter-spacing:.04em;text-wrap:balance}
.lh .eyebrow{font-size:12px;color:var(--sub);letter-spacing:.12em}
.lh .grow{flex:1;min-width:0}
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:12px;padding:12px 0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.fbar .ft{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}
.track>i{display:block;height:100%;border-radius:99px;background:var(--ai);width:0;transition:width .3s ease}
.track.gold>i{background:var(--gold)}
.track.warn>i{background:var(--ng)}

/* ---------- home ---------- */
.hero{background:var(--hero);color:var(--on-hero);border-radius:22px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"三百十五";position:absolute;right:-6px;top:-10px;writing-mode:vertical-rl;font-family:var(--f-disp);font-weight:800;font-size:64px;opacity:.09;letter-spacing:.05em;pointer-events:none}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .rv b{font-size:24px;font-weight:700}
.ring .rv small{display:block;font-size:10px;opacity:.75;margin-top:2px}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.hstat{background:color-mix(in srgb,var(--on-hero) 12%,transparent);border-radius:12px;padding:8px 10px}
.hstat .k{font-size:11px;opacity:.8}
.hstat .v{font-size:20px;font-weight:700}
.hstat .v small{font-size:11px;font-weight:500;opacity:.8;margin-left:2px}
.hstat.wide{grid-column:1/-1}
.cont{margin-top:14px;width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.cont .ci{width:52px;height:52px;border-radius:50%;background:var(--gold);color:#3a2706;display:grid;place-items:center;flex:none}
.cont .ci svg{width:24px;height:24px}
.cont .ct{flex:1;min-width:0}
.cont .ct .k{font-size:12px;color:var(--sub)}
.cont .ct .v{font-family:var(--f-disp);font-size:19px;font-weight:700;line-height:1.35}
.cont .ct .s{font-size:12px;color:var(--sub)}
.sec-t{font-size:12px;color:var(--sub);letter-spacing:.14em;margin:24px 2px 8px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:120px}
.mode .mi{width:38px;height:38px;border-radius:11px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center}
.mode .mi svg{width:20px;height:20px}
.mode b{font-size:15px}
.mode span{font-size:11.5px;color:var(--sub);line-height:1.5}
@media (max-width:360px){.modes{grid-template-columns:1fr 1fr}}
.wod{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:16px;align-items:stretch}
.wod .vw{writing-mode:vertical-rl;font-family:var(--f-disp);font-weight:800;font-size:26px;letter-spacing:.08em;line-height:1.1;border-right:1px solid var(--line);padding-right:14px;flex:none}
.wod .wm{flex:1;min-width:0;font-size:14px;line-height:1.75}
.wod .wm .k{font-size:12px;color:var(--sub);margin-bottom:4px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--sub);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ai);font-weight:700}

/* ---------- step path ---------- */
.rounds{display:flex;gap:6px;margin:4px 0 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rnote{font-size:12.5px;color:var(--sub);margin:10px 2px 0;line-height:1.7}
.unit{margin:22px 0 4px;background:var(--hero);color:var(--on-hero);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px}
.unit .ut{flex:1;min-width:0}
.unit .ut .k{font-size:11px;opacity:.8;letter-spacing:.12em}
.unit .ut .v{font-family:var(--f-disp);font-weight:700;font-size:19px}
.unit .uc{font-size:13px;font-weight:700;background:color-mix(in srgb,var(--on-hero) 15%,transparent);border-radius:99px;padding:3px 10px}
.path{position:relative;padding:8px 0}
.node-row{display:flex;justify-content:center;padding:9px 0}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;width:140px}
.node .nb{width:68px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--sub);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 60%,var(--ink) 18%);transition:transform .12s}
.node:active .nb{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--line) 60%,var(--ink) 18%)}
.node .nb svg{width:28px;height:28px}
.node.open .nb{background:var(--ai);color:var(--on-ai);box-shadow:0 6px 0 color-mix(in srgb,var(--ai) 60%,#000 40%)}
.node.cleared .nb{background:var(--gold);color:#3a2706;box-shadow:0 6px 0 color-mix(in srgb,var(--gold) 65%,#000 35%)}
.node.exam .nb{width:78px;height:70px;border-radius:24px}
.node.locked{cursor:not-allowed}
.node.locked .nl{opacity:.55}
.node .nl{font-size:12.5px;font-weight:700;text-align:center;line-height:1.35}
.node .nl small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.node.current .nb{animation:bob 1.8s ease-in-out infinite}
.node .here{position:absolute;top:-30px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--ai);white-space:nowrap}
.node .here::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.node .best{position:absolute;top:-4px;right:26px;background:var(--card);border:1px solid var(--line);border-radius:99px;font-size:10px;font-weight:700;padding:0 6px;color:var(--ok)}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet .k{font-size:12px;color:var(--sub);letter-spacing:.1em}
.sheet h2{font-family:var(--f-disp);font-size:24px;margin:2px 0 12px;font-weight:800}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.fact{background:var(--paper);border-radius:12px;padding:10px;text-align:center}
.fact .v{font-size:19px;font-weight:700}
.fact .k{font-size:11px;letter-spacing:0}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:14px;padding:14px;font-size:16px;font-weight:700;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn+.btn{margin-top:10px}
.btn.pri{background:var(--ai);border-color:var(--ai);color:var(--on-ai);box-shadow:0 4px 0 color-mix(in srgb,var(--ai) 60%,#000 40%)}
.btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ai) 60%,#000 40%)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2706;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 65%,#000 35%)}
.btn svg{width:20px;height:20px}
.btnrow{display:flex;gap:10px}
.btnrow .btn+.btn{margin-top:0}

/* ---------- setup ---------- */
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:10px}
.gtitle{font-size:12px;color:var(--sub);letter-spacing:.12em;margin:18px 4px 0}
.presets{display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets .chip{flex:none}
.rangebox{display:flex;align-items:center;gap:10px;padding:0 14px 14px}
.rangebox label{font-size:12px;color:var(--sub)}
.rangebox input{width:84px;font:inherit;font-size:17px;font-weight:700;text-align:center;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line2);cursor:pointer}
.group .sw:first-child{border-top:0}
.sw .t{flex:1;min-width:0;font-size:15px}
.sw .t small{display:block;font-size:12px;color:var(--sub)}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .tg{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw .tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw input:checked+.tg{background:var(--ok)}
.sw input:checked+.tg::after{transform:translateX(18px)}
.sw input:focus-visible+.tg{outline:2px solid var(--ai);outline-offset:2px}
.seg{display:flex;background:var(--paper);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.segrow{padding:12px 14px;border-top:1px solid var(--line2)}
.segrow .t{font-size:13px;color:var(--sub);margin-bottom:8px}
.startbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin-top:8px;z-index:10;padding:10px 0 12px;background:linear-gradient(to top,var(--paper) 70%,transparent)}
.poolc{text-align:center;font-size:12.5px;color:var(--sub);margin:12px 0 8px}

/* ---------- list ---------- */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);padding:8px 0 10px;display:flex;gap:8px}
.search .sb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search .sb svg{width:18px;height:18px;color:var(--sub);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:11px 0;outline:none}
.togglebtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.togglebtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lchap{font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--ai);margin:22px 4px 8px;display:flex;align-items:center;gap:10px}
.lchap::after{content:"";flex:1;height:1px;background:var(--line)}
.ent{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.ent .eno{grid-row:1/span 3;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.ent .eno .n{font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.ent .eno .n.tagged{color:var(--ai)}
.ent .chk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:transparent}
.ent .chk svg{width:16px;height:16px}
.ent.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ent .eh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.ent .w{font-family:var(--f-disp);font-weight:800;font-size:21px;line-height:1.3}
.ent .kj{font-size:13px;color:var(--sub)}
.ent .pos{font-size:11px;color:var(--sub);background:var(--paper);border-radius:6px;padding:1px 7px}
.ent .m{font-size:14.5px;line-height:1.75;min-width:0;overflow-wrap:anywhere}
.ent .eh,.ent .m{grid-column:2}
.ent .rel{grid-column:2;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;display:flex;flex-direction:column;gap:5px;min-width:0}
.r{display:grid;grid-template-columns:auto minmax(0,max-content) minmax(0,1fr);gap:8px;align-items:baseline;font-size:13.5px;line-height:1.6}
.r .rw{font-weight:700;font-family:var(--f-disp);font-size:15px;max-width:11em;overflow-wrap:anywhere}
.r .rm{color:var(--ink);min-width:0}
.tag{font-size:10.5px;font-weight:700;border-radius:5px;padding:0 5px;line-height:18px;flex:none}
.tag.関{background:var(--ai-soft);color:var(--ai)}
.tag.同{background:var(--ok-soft);color:var(--ok)}
.tag.反{background:var(--ng-soft);color:var(--ng)}
.tag.類{background:var(--gold-soft);color:color-mix(in srgb,var(--gold) 70%,var(--ink))}
.hide-m .m,.hide-m .rm{color:transparent;background:var(--line2);border-radius:6px;cursor:pointer;user-select:none}
.hide-m .m.show,.hide-m .rm.show{color:inherit;background:none}
.empty{text-align:center;color:var(--sub);padding:48px 0;font-size:14px}

/* ---------- flashcard ---------- */
.stack{position:relative;height:min(62vh,460px);margin-top:8px;perspective:1200px}
.fc{position:absolute;inset:0;cursor:grab;touch-action:pan-y;user-select:none}
.fc .inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.face.back{transform:rotateY(180deg);justify-content:flex-start;align-items:stretch;overflow-y:auto}
.face .meta{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.face .vw{writing-mode:vertical-rl;font-family:var(--f-disp);font-weight:800;font-size:44px;letter-spacing:.12em;line-height:1.15;max-height:78%}
.face .hw{font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1.4;text-align:center;text-wrap:balance}
.face .kj{margin-top:12px;font-size:14px;color:var(--sub)}
.face .tap{position:absolute;bottom:16px;font-size:12px;color:var(--sub)}
.face .bw{font-family:var(--f-disp);font-weight:800;font-size:22px;margin-top:22px}
.face .bm{margin-top:12px;font-size:17px;line-height:1.9}
.face .bm div+div{margin-top:4px}
.stamp{position:absolute;top:28px;font-size:22px;font-weight:800;border:3px solid;border-radius:12px;padding:2px 12px;opacity:0;transform:rotate(-12deg);pointer-events:none}
.stamp.ok{right:24px;color:var(--ok)}
.stamp.ng{left:24px;color:var(--ng);transform:rotate(12deg)}
.fc.ghost{transform:scale(.95) translateY(14px);opacity:.6;pointer-events:none}
.swipehint{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:12px 4px 0}
.cardbtns{display:flex;gap:12px;margin-top:12px}
.cardbtns .btn{margin:0}
.btn.ngb{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 40%,var(--line))}
.btn.okb{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:2px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:5px}
.timer svg{width:16px;height:16px}
.timer.warn{color:var(--ng)}
.qcard{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.qcard .qm{font-size:12px;color:var(--sub)}
.qcard .qw{font-family:var(--f-disp);font-weight:800;font-size:34px;line-height:1.35;margin-top:6px;text-wrap:balance}
.qcard .qk{font-size:14px;color:var(--sub)}
.combo{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:2px 10px}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;font-size:15px;line-height:1.65;padding:13px 14px;border-radius:16px;border:1.5px solid var(--line);border-bottom-width:4px;background:var(--card);cursor:pointer;transition:transform .08s}
.choice:active{transform:translateY(2px)}
.choice .ck{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--sub)}
.choice.right{background:var(--ok-soft);border-color:var(--ok)}
.choice.right .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{background:var(--ng-soft);border-color:var(--ng);animation:shake .35s}
.choice.wrong .ck{background:var(--ng);border-color:var(--ng);color:#fff}
.choice.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- result ---------- */
.res{text-align:center;padding:20px 0 6px;position:relative}
.res .ring{width:160px;height:160px;margin:0 auto}
.res .ring .rv b{font-size:40px}
.res .ring .rv small{font-size:12px;color:var(--sub);opacity:1}
.res h2{font-family:var(--f-disp);font-weight:800;font-size:26px;margin:14px 0 2px}
.res p{color:var(--sub);font-size:13.5px;margin:0}
.seal{position:absolute;top:10px;right:18px;width:78px;height:78px;border-radius:50%;border:3px solid var(--ng);color:var(--ng);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:20px;transform:rotate(-14deg);animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}
.seal.ok{border-color:var(--ok);color:var(--ok)}
@keyframes stampin{from{transform:rotate(-14deg) scale(2.2);opacity:0}}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.rstat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.rstat .v{font-size:20px;font-weight:700}
.rstat .k{font-size:11px;color:var(--sub)}
.miss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;margin-top:16px}
.miss .mt{font-size:12px;color:var(--sub);padding:8px 0 4px}
.miss .r{grid-template-columns:minmax(0,max-content) minmax(0,1fr);padding:8px 0;border-top:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;animation:up .2s}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===== データ ===== */
const groups=[],gmap={};
for(const r of DATA){ if(r.g===r.id){const g={head:r,rel:[]};groups.push(g);gmap[r.id]=g;} else gmap[r.g].rel.push(r); }
let lastNo=0; for(const g of groups){ if(g.head.no) lastNo=g.head.no; g.pos=g.head.no||lastNo+.5; }
const idioms=groups.filter(g=>g.head.t==='慣'); idioms.forEach((g,i)=>g.ki=i+1);
const headOf=r=>gmap[r.g].head;
const RELNAME={関:'関連語',同:'同義語',反:'反対語',類:'類義語'};
function metaOf(r){
  if(r.t==='見') return `No.${pad(r.no)}　${r.p}`;
  if(r.t==='慣') return `慣用句　${r.p}`;
  if(r.t==='言') return `言い換え　${r.p.replace(/^言い換え/,'')}`;
  if(r.t==='代') return `代名詞表`;
  const h=headOf(r); return `${h.no?pad(h.no)+' ':''}${h.w} の${RELNAME[r.t]}`;
}

/* ===== 学習記録 ===== */
let known=new Set(LS.get('k315_known',[]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
let act=LS.get('k315_act',{days:[],date:'',n:0});
function logStudy(){
  const t=today(); if(act.date!==t){act.date=t;act.n=0;} act.n++;
  if(!act.days.includes(t)){act.days.push(t); if(act.days.length>400) act.days=act.days.slice(-400);}
  LS.set('k315_act',act);
}
function streak(){
  const set=new Set(act.days); let n=0; const d=new Date();
  if(!set.has(today())) d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); if(set.has(k)){n++;d.setDate(d.getDate()-1);} else break;}
  return n;
}
function mark(r,ok){ if(ok) known.add(r.id); else known.delete(r.id); LS.set('k315_known',[...known]); logStudy(); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

/* ===== ステップアップ定義 ===== */
const CLEAR_RATE=.8, SEC=2.5, CHUNK=20;
const SECTIONS=[
  {grp:'第一章 最重要語',name:'動詞',a:1,b:38},{grp:'第一章 最重要語',name:'形容詞',a:39,b:82},
  {grp:'第一章 最重要語',name:'形容動詞',a:83,b:96},{grp:'第一章 最重要語',name:'名詞',a:97,b:127},
  {grp:'第一章 最重要語',name:'副詞',a:128,b:163},{grp:'第一章 最重要語',exam:'章末テスト',a:1,b:163,n:[30,40]},
  {grp:'第二章 重要語',name:'動詞',a:164,b:192},{grp:'第二章 重要語',name:'形容詞',a:193,b:228},
  {grp:'第二章 重要語',name:'形容動詞',a:229,b:241},{grp:'第二章 重要語',name:'名詞',a:242,b:278},
  {grp:'第二章 重要語',name:'副詞',a:279,b:289},{grp:'第二章 重要語',exam:'章末テスト',a:164,b:289,n:[30,40]},
  {grp:'敬語の章',name:'敬語',a:290,b:315},{grp:'敬語の章',exam:'章末テスト',a:290,b:315,n:[20,30]},
  {grp:'慣用句の章',name:'慣用句',idiom:true,a:1,b:65},{grp:'慣用句の章',exam:'章末テスト',idiom:true,a:1,b:65,n:[25,30]},
  {grp:'総まとめ',exam:'総まとめテスト',all:true,n:[50,70]},
];
const STAGES=[];
for(const s of SECTIONS){
  if(s.exam){STAGES.push({id:'x:'+s.grp+s.exam,grp:s.grp,name:s.exam,exam:true,sec:s});continue;}
  const cnt=s.b-s.a+1,k=Math.ceil(cnt/CHUNK),size=Math.ceil(cnt/k);
  for(let i=0;i<k;i++){const a=s.a+i*size,b=Math.min(s.b,a+size-1);
    STAGES.push({id:(s.idiom?'k':'n')+a+'-'+b,grp:s.grp,name:s.name+(k>1?' '+'①②③④⑤'[i]:''),range:s.idiom?`慣用句 ${a}〜${b}`:`No.${a}〜${b}`,sec:{...s,a,b}});}
}
function stageGroups(sec){
  if(sec.all) return groups.filter(g=>g.head.t!=='代');
  if(sec.idiom) return idioms.filter(g=>g.ki>=sec.a&&g.ki<=sec.b);
  return groups.filter(g=>(g.head.t==='見'&&g.head.no>=sec.a&&g.head.no<=sec.b)||(g.head.t==='言'&&g.pos>=sec.a&&g.pos<=sec.b+.5));
}
function stageItems(st,round){const out=[];for(const g of stageGroups(st.sec)){ if(round===1){if(g.head.t!=='言')out.push(g.head);} else out.push(g.head,...g.rel);} return out;}
const qCount=(st,r)=>{const n=stageItems(st,r).length;return st.exam?Math.min(st.sec.n[r===1?0:1],n):n;};
let prog=LS.get('k315_step',{round:1,cleared:{}});
const saveProg=()=>LS.set('k315_step',prog);
const clearedOf=r=>prog.cleared[r]||(prog.cleared[r]={});
let viewRound=prog.round;
function stageState(i,r){const c=clearedOf(r),st=STAGES[i];if(c[st.id]!==undefined)return'cleared';if(i===0||c[STAGES[i-1].id]!==undefined)return'open';return'locked';}
function nextStageIndex(r){for(let i=0;i<STAGES.length;i++) if(stageState(i,r)==='open') return i; return -1;}

/* ===== 範囲設定 ===== */
const PRESETS=[['全部',1,315],['第一章',1,163],['動詞',1,38],['形容詞',39,82],['形容動詞',83,96],['名詞',97,127],['副詞',128,163],['第二章',164,289],['二・動詞',164,192],['二・形容詞',193,228],['二・形容動詞',229,241],['二・名詞',242,278],['二・副詞',279,289],['敬語',290,315]];
let cfg=Object.assign({from:1,to:315,incHead:true,incRel:true,incIdiom:true,incIkae:true,incExtra:false,onlyNg:false,qnum:20,timed:true,shuffle:true,reverse:false},LS.get('k315_cfg',{}));
const saveCfg=()=>LS.set('k315_cfg',cfg);
function inRange(g){
  const a=+cfg.from||1,b=+cfg.to||315,t=g.head.t;
  if(t==='見') return g.head.no>=a&&g.head.no<=b;
  if(t==='慣') return cfg.incIdiom;
  if(t==='言') return cfg.incIkae&&g.pos>=a&&g.pos<=b+.5;
  return cfg.incExtra&&g.pos>=a&&g.pos<=b+.5;
}
function pool(){const out=[];for(const g of groups){if(!inRange(g))continue;if(g.head.t!=='見'||cfg.incHead)out.push(g.head);if(cfg.incRel)out.push(...g.rel);}return cfg.onlyNg?out.filter(r=>!known.has(r.id)):out;}

$$('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function ringSVG(p,size,stroke,color,track){
  const r=(size-stroke)/2,c=2*Math.PI*r;

}

/* --- ステップアップ --- */
function renderStep(){
  const r=viewRound,c=clearedOf(r),ni=nextStageIndex(r);
  let html=`<div class="lh"><div class="grow"><div class="eyebrow">STEP UP</div><h1>ステップアップ</h1></div></div>
  <div class="rounds">${Array.from({length:prog.round},(_,i)=>`<button class="chip${i+1===r?' on':''}" data-r="${i+1}">${i+1}周目</button>`).join('')}</div>
  <div class="rnote">${r===1?'1周目は<b>見出し語だけ</b>を出題。総まとめテストをクリアすると2周目（関連語・類義語・反対語・言い換えも出題）が始まります。':`${r}周目は<b>見出し語＋関連語・同義語・反対語・類義語・言い換え</b>を出題します。`}<br>クリア条件：1問2.5秒の制限時間内に全問答えて、8割以上正解。</div>`;
  let lastG='',k=0;
  STAGES.forEach((st,i)=>{
    if(st.grp!==lastG){
      const inG=STAGES.filter(s=>s.grp===st.grp),done=inG.filter(s=>c[s.id]!==undefined).length;
      html+=(lastG?'</div>':'')+`<div class="unit"><div class="ut"><div class="k">${st.grp==='総まとめ'?'FINAL':'UNIT'}</div><div class="v">${esc(st.grp)}</div></div><span class="uc num">${done}/${inG.length}</span></div><div class="path">`;
      lastG=st.grp;k=0;
    }
    const state=stageState(i,r),off=[0,-60,-90,-60,0,60,90,60][k%8];k++;
    const icon=state==='locked'?ICON.lock:state==='cleared'?(st.exam?ICON.star:ICON.check):(st.exam?ICON.star:ICON.book);
    html+=`<div class="node-row"><button class="node ${state}${st.exam?' exam':''}${i===ni?' current':''}" data-i="${i}" style="transform:translateX(${off}px)" ${state==='locked'?'aria-disabled="true"':''}>
      ${i===ni?'<span class="here">ここから</span>':''}${state==='cleared'?`<span class="best num">${c[st.id]}%</span>`:''}
      <span class="nb">${icon}</span><span class="nl">${esc(st.name)}<small>${st.range?esc(st.range):qCount(st,r)+'問'}</small></span></button></div>`;
  });
  app.innerHTML=html+'</div>';
  $$('.rounds .chip').forEach(b=>b.onclick=()=>{viewRound=+b.dataset.r;renderStep();});
  $$('.node').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(stageState(i,viewRound)==='locked'){toast('前のステージをクリアすると解放されます');return;} openSheet(i); });
  const cur=$('.node.current'); if(cur) setTimeout(()=>cur.scrollIntoView({block:'center',behavior:'smooth'}),60);
}
function openSheet(i){
  const st=STAGES[i],r=viewRound,items=stageItems(st,r),n=qCount(st,r),need=Math.ceil(n*CLEAR_RATE),best=clearedOf(r)[st.id];
  const sc=document.createElement('div'); sc.className='scrim';
  sc.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(st.name)}"><div class="grab"></div>
    <div class="k">${esc(st.grp)}・${r}周目${st.range?'・'+esc(st.range):''}</div>
    <h2>${esc(st.name)}</h2>
    <div class="facts"><div class="fact"><div class="v num">${n}</div><div class="k">問題数</div></div><div class="fact"><div class="v">${fmtTime(n*SEC)}</div><div class="k">制限時間</div></div><div class="fact"><div class="v num">${need}</div><div class="k">合格ライン</div></div></div>
    <p style="font-size:13px;color:var(--sub);margin:0 0 14px;line-height:1.7">${r===1?'見出し語のみ':'見出し語＋関連語など'}${st.exam?`。範囲の${items.length}語からランダムに出題します`:''}。答えを表示している間はタイマーが止まります。${best!==undefined?`<br>ベスト記録：${best}%`:''}</p>
    <button class="btn pri" id="sGo">${ICON.play}テストを始める</button>
    ${st.exam?'':`<button class="btn" id="sCard">${ICON.card}先にカードで覚える（${items.length}語）</button>`}
  </div>`;
  document.body.appendChild(sc);
  const close=()=>sc.remove();
  sc.onclick=e=>{if(e.target===sc)close();};
  sc.querySelector('#sGo').onclick=()=>{close();runStage(i);};
  if(!st.exam) sc.querySelector('#sCard').onclick=()=>{close();startCards(items,{title:st.name+'・予習',shuffle:false,forward:true,exit:()=>setTab('step'),next:()=>runStage(i),nextLabel:'テストに挑戦'});};
}
function runStage(i){
  const st=STAGES[i],r=viewRound,all=stageItems(st,r);
  const items=shuffle(all.slice()).slice(0,qCount(st,r));
  startQuiz({items,timed:true,title:st.name,exit:()=>setTab('step'),onFinish:res=>{
    const pct=Math.round(res.ok/res.total*100), clear=!res.timeUp&&res.ok>=Math.ceil(res.total*CLEAR_RATE);
    let note='';
    if(clear){ const c=clearedOf(r); c[st.id]=Math.max(c[st.id]||0,pct);
      if(i===STAGES.length-1&&r===prog.round){prog.round++;note=`全ステージクリア！ ${prog.round}周目が解放されました。次の周からは関連語も出題されます。`;}
      saveProg(); }
    else note=res.timeUp?'時間切れ。1問2.5秒のペースを目指しましょう。':`合格ラインは${Math.ceil(res.total*CLEAR_RATE)}問です。`;
    const last=i===STAGES.length-1;
    showResult(res,{title:st.name,clear,note,again:()=>runStage(i),exit:()=>setTab('step'),
      next:clear?(last?()=>{viewRound=prog.round;setTab('step');}:()=>{setTab('step');openSheet(i+1);}):null,
      nextLabel:last?'次の周へ':'次のステージへ'});
  }});
}

  if(isTest) $$('#qnum button').forEach(b=>b.onclick=()=>{cfg.qnum=+b.dataset.n;$$('#qnum button').forEach(x=>x.classList.toggle('on',x===b));upd();});
  $('#go').onclick=()=>{
    const p=pool(); if(!p.length){toast('この範囲には単語がありません');return;}
    if(isTest){const items=shuffle(p.slice()).slice(0,+cfg.qnum||p.length);
      const run=()=>startQuiz({items:shuffle(items.slice()),timed:cfg.timed,title:'テスト',exit:()=>setTab('test'),onFinish:res=>showResult(res,{title:'テスト',note:'',again:run,exit:()=>setTab('test')})});run();}
    else startCards(p,{title:'暗記カード',shuffle:cfg.shuffle,exit:()=>setTab('card')});
  };
  upd();
}

/* --- 一覧 --- */
let listQ='',hideM=false;
function renderList(){
  app.innerHTML=`<div class="lh"><div class="grow"><div class="eyebrow">WORD LIST</div><h1>単語一覧</h1></div></div>
  <div class="search"><div class="sb">${ICON.search}<input type="search" id="lq" placeholder="単語・漢字・意味で検索" value="${esc(listQ)}"></div><button class="togglebtn${hideM?' on':''}" id="lh">意味を隠す</button></div>
  <div class="presets" style="padding:0 0 4px">${[['すべて',0],['第一章',1],['第二章',164],['敬語',290],['慣用句','k'],['言い換え','l'],['代名詞','p']].map(([t,v])=>`<button class="chip" data-j="${v}">${t}</button>`).join('')}</div>
  <div id="lbody"></div>`;
  $('#lq').oninput=e=>{listQ=e.target.value;drawList();};
  $('#lh').onclick=e=>{hideM=!hideM;e.target.classList.toggle('on',hideM);drawList();};
  $$('[data-j]').forEach(b=>b.onclick=()=>{const v=b.dataset.j;let sel;
    if(v==='0'){window.scrollTo({top:0,behavior:'smooth'});return;}
    sel=v==='k'?'[data-g="慣1"]':v==='l'?'[data-g="言1"]':v==='p'?'[data-g="代1"]':`[data-g="${v}"]`;
    const el=$(sel); if(el) window.scrollTo({top:el.getBoundingClientRect().top+scrollY-120,behavior:'smooth'});});
  drawList();
}
function drawList(){
  const q=listQ.trim(),match=r=>!q||(r.w+r.k+r.m+r.p).includes(q);
  const out=[];let lastC='';
  for(const g of groups){
    const hh=match(g.head),rh=g.rel.filter(match); if(!hh&&!rh.length) continue;
    if(g.head.c!==lastC){out.push(`<div class="lchap">${esc(g.head.c)}</div>`);lastC=g.head.c;}
    const h=g.head,d=known.has(h.id),rs=q&&!hh?rh:g.rel;
    const no=h.t==='見'?`<span class="n">${pad(h.no)}</span>`:`<span class="n tagged">${h.t}</span>`;
    out.push(`<div class="ent${d?' done':''}" data-g="${h.id}"><div class="eno">${no}<button class="chk" data-id="${h.id}" aria-label="覚えた">${ICON.check}</button></div>
      <div class="eh"><span class="w">${esc(h.w)}</span>${h.k?`<span class="kj">〔${esc(h.k)}〕</span>`:''}<span class="pos">${esc(h.p)}</span></div>
      <div class="m">${fmtM(h.m)}</div>
      ${rs.length?`<div class="rel">${rs.map(r=>`<div class="r"><span class="tag ${r.t}">${r.t}</span><span class="rw">${esc(r.w)}</span><span class="rm">${esc(r.m)}</span></div>`).join('')}</div>`:''}</div>`);
  }
  const lb=$('#lbody'); lb.className=hideM?'hide-m':''; lb.innerHTML=out.join('')||'<div class="empty">見つかりませんでした</div>';
  lb.onclick=e=>{
    const b=e.target.closest('.chk');
    if(b){const g=gmap[b.dataset.id],ids=[g.head.id,...g.rel.map(r=>r.id)],on=!known.has(g.head.id);
      ids.forEach(i=>on?known.add(i):known.delete(i));LS.set('k315_known',[...known]);b.closest('.ent').classList.toggle('done',on);return;}
    const m=e.target.closest('.m,.rm'); if(m&&hideM) m.classList.toggle('show');
  };
}

/* --- 暗記カード --- */
let deck=[],di=0,dopt={};
function startCards(items,opt){ deck=items.slice(); if(opt.shuffle) shuffle(deck); di=0; dopt=opt; focusMode(); drawCard(); }
function drawCard(){
  const rev=!dopt.forward&&cfg.reverse;
  if(di>=deck.length){
    app.innerHTML=`<div class="fbar"><button class="iconbtn" id="x" aria-label="閉じる">${ICON.close}</button><div class="ft">${esc(dopt.title)}</div></div>
    <div class="res"><div class="ring">${ringSVG(1,160,12,'var(--gold)','var(--line)')}<div class="rv"><div><b class="num">${deck.length}</b><small>語</small></div></div></div>
    <h2>一周しました</h2><p>「まだ」の語はもう一周すると覚えやすくなります</p></div>
    <div style="margin-top:20px">${dopt.next?`<button class="btn pri" id="nx">${esc(dopt.nextLabel)}</button>`:''}<button class="btn" id="ag">もう一周</button><button class="btn" id="ng">「まだ」の語だけもう一周</button></div>`;
    $('#x').onclick=dopt.exit; $('#ag').onclick=()=>startCards(deck,dopt);
    $('#ng').onclick=()=>{const n=deck.filter(r=>!known.has(r.id)); if(!n.length){toast('全部「覚えた」になっています');return;} startCards(n,dopt);};
    if(dopt.next) $('#nx').onclick=dopt.next; return;
  }
  const r=deck[di],nx=deck[di+1];
  const word=(x)=>{const vert=x.w.length<=9&&!/[・（／]/.test(x.w);return `${vert?`<div class="vw">${esc(x.w)}</div>`:`<div class="hw">${esc(x.w)}</div>`}${x.k?`<div class="kj">〔${esc(x.k)}〕</div>`:''}`;};
  const meaning=x=>`<div class="bm">${meanLines(x.m).map(l=>`<div>${l}</div>`).join('')}</div>`;
  const front=rev?`<div class="bm" style="text-align:center">${fmtM(r.m)}</div>`:word(r);
  const back=rev?`<div style="margin:auto;text-align:center">${word(r)}</div>`:`<div class="bw">${esc(r.w)}${r.k?` <span style="font-size:14px;color:var(--sub);font-weight:500">〔${esc(r.k)}〕</span>`:''}</div>${meaning(r)}`;
  app.innerHTML=`<div class="fbar"><button class="iconbtn" id="x" aria-label="閉じる">${ICON.close}</button><div class="track gold"><i style="width:${di/deck.length*100}%"></i></div><span class="num" style="font-size:13px;color:var(--sub)">${di+1}/${deck.length}</span></div>
  <div class="stack">
    ${nx?`<div class="fc ghost"><div class="inner"><div class="face"></div></div></div>`:''}
    <div class="fc" id="fc"><div class="inner">
      <div class="face"><div class="meta"><span>${esc(metaOf(r))}</span><span>${known.has(r.id)?'✓ 覚えた':''}</span></div>${front}<div class="tap">タップでめくる</div><span class="stamp ok">覚えた</span><span class="stamp ng">まだ</span></div>
      <div class="face back"><div class="meta"><span>${esc(metaOf(r))}</span></div>${back}</div>
    </div></div>
  </div>
  <div class="swipehint"><span>← まだ</span><span>覚えた →</span></div>
  <div class="cardbtns"><button class="btn ngb" id="bn">まだ</button><button class="btn okb" id="bo">覚えた</button></div>`;
  $('#x').onclick=dopt.exit; $('#bn').onclick=()=>cardGo(false); $('#bo').onclick=()=>cardGo(true);
  const fc=$('#fc'); let sx=0,dx=0,down=false,moved=false;
  fc.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;dx=0;fc.style.transition='none';});
  fc.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;if(Math.abs(dx)>6){moved=true;fc.setPointerCapture?.(e.pointerId);}
    fc.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    fc.querySelector('.stamp.ok').style.opacity=Math.max(0,Math.min(1,dx/90));fc.querySelector('.stamp.ng').style.opacity=Math.max(0,Math.min(1,-dx/90));});
  const end=()=>{if(!down)return;down=false;fc.style.transition='transform .25s';
    if(Math.abs(dx)>90){cardGo(dx>0);return;}
    fc.style.transform='';fc.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0);
    if(!moved) fc.classList.toggle('flip');};
  fc.addEventListener('pointerup',end); fc.addEventListener('pointercancel',end);
}
function cardGo(ok){
  const fc=$('#fc'); if(!fc||fc.dataset.gone) return; fc.dataset.gone=1;
  mark(deck[di],ok);
  fc.style.transition='transform .28s ease-in,opacity .28s';fc.style.transform=`translateX(${ok?420:-420}px) rotate(${ok?18:-18}deg)`;fc.style.opacity=0;
  setTimeout(()=>{di++;drawCard();},230);
}

/* --- 4択テスト --- */
let quiz=null;
// 訳語を①②…ごとに分割し、比較用のキーワードも作る
function sensesOf(r){
  if(r._s) return r._s;
  let m=r.m.replace(/※.*$/,'').trim();
  let parts=m.split(/(?=[①-⑩])/).map(x=>x.replace(/^[　\s]*[ＡＢＣ]?[　\s]*/,'').replace(/^[①-⑩]/,'').replace(/[　\s]*[ＡＢＣ]$/,'').trim()).filter(Boolean);
  if(!parts.length) parts=[m];
  parts=parts.map(t=>t.replace(/〈現代語と同じ〉/g,'').trim());
  return r._s=parts.map(txt=>({txt,keys:keysOf(txt)}));
}
function keysOf(t){
  const base=t.replace(/〈[^〉]*〉/g,'').replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'');
  return base.split(/[・、／,]/).map(x=>x.replace(/[〜～\s　]/g,'')).filter(x=>x.length>=2);
}
const overlap=(a,b)=>a.keys.some(k=>b.keys.some(j=>k===j||(k.length>=3&&j.includes(k))||(j.length>=3&&k.includes(j))))||a.txt===b.txt;
let SENSEPOOL=null;
function sensePool(){
  if(SENSEPOOL) return SENSEPOOL;
  SENSEPOOL=[];
  for(const x of DATA){ if(x.t==='代') continue; for(const s of sensesOf(x)) SENSEPOOL.push({...s,w:x.w,cat:catOf(x)}); }
  return SENSEPOOL;
}
const catOf=x=>x.p.replace(/^敬語/,'').replace(/[・（].*$/,'');
function choicesFor(r){
  const mine=sensesOf(r), correct=mine[Math.floor(Math.random()*mine.length)];
  const cat=catOf(r), all=sensePool();
  const ok=s=>s.w!==r.w && !mine.some(m=>overlap(m,s));
  const picked=[];
  const tryAdd=s=>{ if(picked.length<3 && ok(s) && !picked.some(p=>overlap(p,s))) picked.push(s); };
  shuffle(all.filter(s=>s.cat===cat)).forEach(tryAdd);
  if(picked.length<3) shuffle(all.slice()).forEach(tryAdd);
  return shuffle([{txt:correct.txt,ok:true},...picked.map(p=>({txt:p.txt,ok:false}))]);
}
function startQuiz(o){
  focusMode();
  quiz={...o,i:0,ok:0,combo:0,maxCombo:0,wrong:[],total:o.items.length*SEC*1000,locked:false,timeUp:false};
  quiz.left=quiz.total; drawQ();
  if(o.timed){let last=Date.now();timerId=setInterval(()=>{const now=Date.now();if(!quiz.locked)quiz.left-=now-last;last=now;drawTimer();if(quiz.left<=0){quiz.timeUp=true;endQuiz();}},100);}
}
function drawTimer(){
  if(!quiz||!quiz.timed)return; const t=$('#tm'),b=$('#tb'); if(!t)return;
  const s=Math.max(0,quiz.left/1000),warn=s<=Math.min(15,quiz.total/4000);
  t.innerHTML=`${ICON.clock}${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; t.classList.toggle('warn',warn);
  b.style.width=(Math.max(0,quiz.left)/quiz.total*100)+'%'; b.parentNode.classList.toggle('warn',warn);
}
function drawQ(){
  const q=quiz,r=q.items[q.i],opts=choicesFor(r);
  app.innerHTML=`<div class="fbar"><button class="iconbtn" id="x" aria-label="やめる">${ICON.close}</button>
    <div class="track${q.timed?'':' gold'}"><i id="tb" style="width:${q.timed?100:q.i/q.items.length*100}%"></i></div>
    ${q.timed?'<span class="timer" id="tm"></span>':''}</div>
  <div class="qtop"><span class="num">${esc(q.title)}　${q.i+1} / ${q.items.length}</span><span class="num">正解 ${q.ok}</span></div>
  <div class="qcard"><div class="qm">${esc(metaOf(r))}${sensesOf(r).length>1?'　・意味の一つを選ぶ':''}</div><div class="qw">${esc(r.w)}</div>${r.k?`<div class="qk">〔${esc(r.k)}〕</div>`:''}${q.combo>=3?`<span class="combo">${q.combo}連続正解</span>`:''}</div>
  <div class="choices">${opts.map((o,j)=>`<button class="choice" data-ok="${o.ok}"><span class="ck">${j+1}</span><span>${esc(o.txt)}</span></button>`).join('')}</div>`;
  drawTimer();
  $('#x').onclick=()=>{stopTimer();quiz=null;q.exit();};
  $$('.choice').forEach(b=>b.onclick=()=>{
    if(q.locked)return; q.locked=true; const ok=b.dataset.ok==='true';
    $$('.choice').forEach(x=>{if(x.dataset.ok==='true'){x.classList.add('right');x.querySelector('.ck').innerHTML=ICON.check.replace('<svg','<svg width="16" height="16"');}else if(x!==b)x.classList.add('dim');});
    if(ok){q.ok++;q.combo++;q.maxCombo=Math.max(q.maxCombo,q.combo);}else{b.classList.add('wrong');q.wrong.push(r);q.combo=0;}
    mark(r,ok);
    setTimeout(()=>{if(quiz!==q)return;q.i++;q.locked=false;if(q.i>=q.items.length)endQuiz();else drawQ();},ok?500:1400);
  });
}
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select'))return;
  if(quiz&&!quiz.locked&&/^[1-4]$/.test(e.key)){const b=$$('.choice')[+e.key-1];if(b)b.click();}
  if($('#fc')){if(e.key===' '){e.preventDefault();$('#fc').classList.toggle('flip');}if(e.key==='ArrowRight')cardGo(true);if(e.key==='ArrowLeft')cardGo(false);}
});
function endQuiz(){
  stopTimer(); const q=quiz; quiz=null;
  q.onFinish({ok:q.ok,total:q.items.length,wrong:q.wrong,timeUp:q.timeUp,unanswered:q.items.slice(q.i+(q.timeUp&&q.locked?1:0)),usedSec:Math.round((q.total-Math.max(0,q.left))/1000),timed:q.timed,maxCombo:q.maxCombo});
}
function showResult(res,o){
  focusMode();
  const pct=Math.round(res.ok/res.total*100),miss=[...res.wrong,...res.unanswered];
  const color=o.clear===false?'var(--ng)':pct>=80?'var(--ok)':'var(--gold)';
  const title=o.clear===undefined?(pct>=90?'すばらしい！':pct>=70?'よくできました':'もう少し！'):(o.clear?'クリア！':'もう一歩');
  app.innerHTML=`<div class="fbar"><button class="iconbtn" id="x" aria-label="閉じる">${ICON.close}</button><div class="ft">${esc(o.title)}</div></div>
  <div class="res">${o.clear!==undefined?`<div class="seal${o.clear?' ok':''}">${o.clear?'合格':'不合格'}</div>`:''}
    <div class="ring">${ringSVG(pct/100,160,12,color,'var(--line)')}<div class="rv"><div><b class="num">${pct}<span style="font-size:20px">%</span></b><small>${res.ok} / ${res.total} 正解</small></div></div></div>
    <h2>${title}</h2><p>${esc(o.note||'')}</p></div>
  <div class="rstats"><div class="rstat"><div class="v num">${res.timed?fmtTime(res.usedSec):'—'}</div><div class="k">かかった時間${res.timeUp?'（切れ）':''}</div></div><div class="rstat"><div class="v num">${res.maxCombo}</div><div class="k">最大連続正解</div></div><div class="rstat"><div class="v num">${miss.length}</div><div class="k">間違い・未解答</div></div></div>
  ${o.next?`<button class="btn gold" id="nx">${esc(o.nextLabel)}</button>`:''}
  <div class="btnrow" style="margin-top:10px"><button class="btn" id="ag">もう一度</button>${miss.length?`<button class="btn" id="rv">間違いを復習</button>`:''}</div>
  ${miss.length?`<div class="miss"><div class="mt">間違えた・解けなかった語</div>${miss.map(r=>`<div class="r"><span class="rw">${esc(r.w)}</span><span class="rm">${esc(r.m)}</span></div>`).join('')}</div>`:''}`;
  $('#x').onclick=o.exit; $('#ag').onclick=o.again; if(o.next) $('#nx').onclick=o.next;
  if(miss.length) $('#rv').onclick=()=>startCards(miss,{title:'間違いの復習',shuffle:false,forward:true,exit:o.exit,next:o.again,nextLabel:'テストに再挑戦'});
}

setTab('home');
